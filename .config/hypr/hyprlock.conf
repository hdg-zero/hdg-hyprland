# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/picture/wd_4.jpg
    blur_passes = 2
    contrast = 0.88
    brightness = 0.82
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}


