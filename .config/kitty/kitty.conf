# 🪐 CONFIGURATION KITTY - DESIGN PREMIUM & PROFESSIONNEL

# ---------------------------------------------------------
# 1. POLICES & TYPOGRAPHIE
# ---------------------------------------------------------
font_family           JetBrainsMono Nerd Font
bold_font             JetBrainsMono Nerd Font Bold
italic_font           JetBrainsMono Nerd Font Italic
bold_italic_font      JetBrainsMono Nerd Font Bold Italic
font_size             11.5

# Espacement moderne et aéré (comme sur les éditeurs premium)
adjust_line_height    115%
adjust_column_width   100%

# ---------------------------------------------------------
# 2. DESIGN & GLASSMORPHISM
# ---------------------------------------------------------
# Transparence douce et flou d'arrière-plan (nécessite un compositeur comme Hyprland)
background_opacity         0.80
background_blur            20

# Marges intérieures pour éviter que le texte ne colle aux bords
window_padding_width       14

# Décoration de fenêtre épurée (pas de bordures système superflues)
hide_window_decorations    yes
confirm_os_window_close    0

# ---------------------------------------------------------
# 3. CURSEUR & INTERACTION
# ---------------------------------------------------------
# Curseur sous forme de barre verticale moderne, style VS Code/Neovim
cursor                     #26a69a
cursor_text_color          #0b0f14
cursor_shape               beam
cursor_beam_thickness      1.8
cursor_blink_interval      0.5
cursor_stop_blinking_after 15.0

# Liens cliquables
url_color                  #80cbc4
url_style                  curly
detect_urls                yes
copy_on_select             yes

# ---------------------------------------------------------
# 4. BARRE D'ONGLETS (TAB BAR) PREMIUM
# ---------------------------------------------------------
tab_bar_edge               bottom
tab_bar_style              powerline
tab_bar_powerline_style    slanted
tab_title_template         "{fmt.fg.c12c4c}{index} {title}"

active_tab_foreground      #0b0f14
active_tab_background      #26a69a
active_tab_font_style      bold
inactive_tab_foreground    #b2dfdb
inactive_tab_background    #15202b
inactive_tab_font_style    normal

# ---------------------------------------------------------
# 5. PALETTE DE COULEURS - OBSIDIAN & SOFT TEAL
# ---------------------------------------------------------
# Couleurs principales
foreground                 #e0f2f1
background                 #0b0f14
selection_foreground       #0b0f14
selection_background       #80cbc4

# Les 16 couleurs ANSI (harmonisation professionnelle)
# Noir / Gris foncé
color0                     #15202b
color8                     #37474f

# Rouge (Erreurs / Suppression)
color1                     #e57373
color9                     #ff8a80

# Vert (Succès / Ajouts)
color2                     #81c784
color10                    #b9f6ca

# Jaune (Avertissements)
color3                     #fff176
color11                    #ffff8d

# Bleu (Info / Liens)
color4                     #64b5f6
color12                    #82b1ff

# Magenta (Variables / Spécial)
color5                     #ba68c8
color13                    #ff80ab

# Cyan (Teal / Accents principaux)
color6                     #4db6ac
color14                    #84ffff

# Blanc / Gris clair
color7                     #b2dfdb
color15                    #ffffff

# ---------------------------------------------------------
# 6. DIVERS & PERFORMANCE
# ---------------------------------------------------------
enable_audio_bell          no
visual_bell_duration       0.0
window_alert_on_bell       no
scrollback_lines           10000
